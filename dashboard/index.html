<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Emma Inbox · Sunrise Clinic</title>
<!-- DEMO ONLY: a front-end mock-up of a human-in-the-loop dashboard. Not connected to Supabase, Trigger.dev or Airtable. -->
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --panel-2: #f9fafb; --border: #e4e7ec; --text: #101828; --muted: #667085;
    --brand: #f59e0b; --brand-ink: #7a4a00; --accent: #0f766e; --accent-soft: #e6f4f1;
    --emma-bubble: #ffffff; --patient-bubble: #dcf8c6; --staff-bubble: #e0ecff; --chat-bg: #efeae2;
    --red: #d92d20; --red-soft: #fef3f2; --amber: #b54708; --amber-soft: #fffaeb; --blue: #175cd3; --blue-soft: #eff8ff;
    --green: #067647; --green-soft: #ecfdf3; --grey-soft: #f2f4f7; --purple: #6941c6; --purple-soft: #f4f3ff;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14; --panel: #121821; --panel-2: #161d27; --border: #232c38; --text: #e6e9ee; --muted: #8b95a5;
      --emma-bubble: #1b2430; --patient-bubble: #0f3d2e; --staff-bubble: #17305a; --chat-bg: #0e141b;
      --red-soft: #3a1513; --amber-soft: #33240a; --blue-soft: #0e2340; --green-soft: #0b2b1c; --grey-soft: #1c2430;
      --purple-soft: #221a3d; --accent-soft: #0d2b28; --brand-ink: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  button { font: inherit; cursor: pointer; }
  .app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }

  /* Top bar */
  .topbar { display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #fbbf24, #f97316); display: grid; place-items: center; color: #fff; font-weight: 800; }
  .title { font-weight: 700; font-size: 16px; }
  .sub { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #12b76a; box-shadow: 0 0 0 0 rgba(18,183,106,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(18,183,106,.5);} 70% { box-shadow: 0 0 0 8px rgba(18,183,106,0);} 100% { box-shadow: 0 0 0 0 rgba(18,183,106,0);} }
  .demo-tag { background: var(--amber-soft); color: var(--amber); border: 1px dashed var(--amber); }
  .staff { display: flex; align-items: center; gap: 8px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff; flex: none; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; padding: 14px 20px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .stat .hint { font-size: 11px; color: var(--muted); }
  .stat.alert .value { color: var(--red); }

  /* Main 3-column */
  .main { display: grid; grid-template-columns: 330px 1fr 320px; gap: 12px; padding: 0 20px 16px; min-height: 0; }
  .col { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

  /* Inbox list */
  .search { margin: 12px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2); color: var(--text); width: calc(100% - 24px); }
  .tabs { display: flex; gap: 6px; padding: 0 12px 10px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--border); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
  .tab.active { background: var(--text); color: var(--panel); border-color: var(--text); }
  .tab .n { opacity: .7; margin-left: 4px; }
  .list { overflow-y: auto; flex: 1; border-top: 1px solid var(--border); }
  .item { display: flex; gap: 10px; padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; position: relative; }
  .item:hover { background: var(--panel-2); }
  .item.active { background: var(--accent-soft); }
  .item.urgent::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--red); }
  .item .body { flex: 1; min-width: 0; }
  .item .row1 { display: flex; justify-content: space-between; gap: 8px; }
  .item .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .time { color: var(--muted); font-size: 11px; flex: none; }
  .item .preview { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 2px 0 6px; }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; }
  .badge { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; letter-spacing: .01em; }
  .b-emergency { background: var(--red-soft); color: var(--red); }
  .b-human { background: var(--amber-soft); color: var(--amber); }
  .b-booking { background: var(--blue-soft); color: var(--blue); }
  .b-confirmed { background: var(--green-soft); color: var(--green); }
  .b-ai { background: var(--grey-soft); color: var(--muted); }
  .b-lang { background: var(--purple-soft); color: var(--purple); }
  .b-flag { background: var(--purple-soft); color: var(--purple); }
  .b-staff { background: var(--blue-soft); color: var(--blue); }
  .unread { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; display: grid; place-items: center; font-weight: 700; }

  /* Chat */
  .chat-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .chat-head .name { font-weight: 700; }
  .chat-head .meta { color: var(--muted); font-size: 12px; }
  .mode { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; }
  .mode.ai { background: var(--accent-soft); color: var(--accent); }
  .mode.human { background: var(--amber-soft); color: var(--amber); }
  .btn { border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 13px; }
  .btn:hover { background: var(--panel-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.warn { background: var(--brand); border-color: var(--brand); color: #3b2300; }
  .btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--border)); }
  .banner { margin: 10px 16px 0; padding: 10px 12px; border-radius: 10px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
  .banner.red { background: var(--red-soft); color: var(--red); }
  .banner.amber { background: var(--amber-soft); color: var(--amber); }
  .banner b { display: block; }
  .thread { flex: 1; overflow-y: auto; padding: 16px; background: var(--chat-bg); display: flex; flex-direction: column; gap: 8px; }
  .day { align-self: center; font-size: 11px; color: var(--muted); background: var(--panel); padding: 3px 10px; border-radius: 999px; margin: 4px 0; }
  .msg { max-width: 72%; padding: 8px 11px 6px; border-radius: 12px; box-shadow: 0 1px 1px rgba(0,0,0,.06); white-space: pre-wrap; word-wrap: break-word; }
  .msg .who { font-size: 11px; font-weight: 700; margin-bottom: 2px; }
  .msg .ts { font-size: 10.5px; color: var(--muted); text-align: right; margin-top: 3px; }
  .msg.patient { align-self: flex-start; background: var(--patient-bubble); border-top-left-radius: 4px; }
  .msg.emma { align-self: flex-end; background: var(--emma-bubble); border-top-right-radius: 4px; }
  .msg.emma .who { color: var(--accent); }
  .msg.staff { align-self: flex-end; background: var(--staff-bubble); border-top-right-radius: 4px; }
  .msg.staff .who { color: var(--blue); }
  .event { align-self: center; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px dashed var(--border); padding: 5px 10px; border-radius: 8px; max-width: 85%; text-align: center; }
  .event.red { color: var(--red); border-color: var(--red); background: var(--red-soft); }
  .event.green { color: var(--green); border-color: var(--green); background: var(--green-soft); }
  .event.blue { color: var(--blue); border-color: var(--blue); background: var(--blue-soft); }
  .typing { align-self: flex-end; background: var(--emma-bubble); padding: 10px 14px; border-radius: 12px; display: none; }
  .typing span { display: inline-block; width: 6px; height: 6px; margin: 0 1px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
  .composer { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end; background: var(--panel); }
  .composer textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; background: var(--panel-2); color: var(--text); font: inherit; min-height: 40px; max-height: 120px; }
  .composer textarea:disabled { opacity: .6; }
  .composer-note { font-size: 11.5px; color: var(--muted); padding: 0 12px 8px; background: var(--panel); }
  .suggest { display: flex; gap: 6px; padding: 8px 12px 0; flex-wrap: wrap; background: var(--panel); }
  .chip { border: 1px solid var(--border); background: var(--panel-2); color: var(--text); padding: 4px 10px; border-radius: 999px; font-size: 12px; }

  /* Right panel */
  .side { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .card { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--panel-2); }
  .card h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 8px; font-size: 13px; }
  .kv .k { color: var(--muted); }
  .actions { display: flex; flex-direction: column; gap: 8px; }
  .actions .btn { width: 100%; text-align: left; }
  .ai-summary { font-size: 13px; }
  .flags { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
  .flag { display: flex; gap: 8px; align-items: flex-start; }
  .empty { color: var(--muted); font-size: 13px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--panel); padding: 10px 16px; border-radius: 10px; font-weight: 600; opacity: 0; transition: all .25s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 1100px) { .main { grid-template-columns: 290px 1fr; } .main .right { display: none; } .stats { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 720px) { .main { grid-template-columns: 1fr; padding: 0 16px 16px; } .main .inbox { max-height: 40vh; } .stats { grid-template-columns: repeat(2, 1fr); padding: 12px 16px; } .topbar { padding: 10px 16px; flex-wrap: wrap; } .msg { max-width: 88%; } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">☀</div>
    <div>
      <div class="title">Emma Inbox</div>
      <div class="sub">Sunrise Clinic · WhatsApp AI assistant with human handover</div>
    </div>
    <div class="spacer"></div>
    <span class="pill demo-tag">Demo data</span>
    <span class="pill" style="background:var(--green-soft);color:var(--green)"><span class="live-dot"></span>Emma is online</span>
    <div class="staff"><div class="avatar" style="background:#7c3aed">RN</div><div><div style="font-weight:600;font-size:13px">Rosa N.</div><div class="sub">Front desk</div></div></div>
  </header>

  <section class="stats" id="stats"></section>

  <main class="main">
    <section class="col inbox">
      <input class="search" id="search" placeholder="Search patients or messages…" />
      <div class="tabs" id="tabs"></div>
      <div class="list" id="list"></div>
    </section>

    <section class="col" id="chatCol"></section>

    <aside class="col right"><div class="side" id="side"></div></aside>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------------------------------------------------------------------------
// Example conversations (fake patients, adapted from the stress tests).
// ---------------------------------------------------------------------------
const COLORS = ["#0ea5e9","#f97316","#22c55e","#e11d48","#8b5cf6","#14b8a6","#eab308"];
const conversations = [
  {

    id: 3, name: "Marcus Bell", phone: "+1 (718) 555-0119", lang: "English", unread: 0,
    status: "human", mode: "ai", minsAgo: 14,
    booking: { type: "General check-up", day: "Wed, Nov 25", time: "10:00 AM", reason: "General check-up", status: "Requested" },
    summary: "Upset about a 2-hour wait and being billed $195 instead of $120 on his last visit. Wants a refund and a different doctor. Emma couldn't promise either.",

conversations.forEach((c, i) => (c.color = COLORS[i % COLORS.length]));

// ---------------------------------------------------------------------------
// State + helpers
// ---------------------------------------------------------------------------
let selectedId = 1;
let filter = "all";
let query = "";
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s) => esc(s).replace(/\*(.+?)\*/g, "<b>$1</b>");
const initials = (n) => n.split(" ").map((w) => w[0]).join("").slice(0, 2);
const nowTime = () => new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]M/i, "");
const ago = (m) => (m < 1 ? "now" : m < 60 ? `${m}m` : `${Math.floor(m / 60)}h`);
const current = () => conversations.find((c) => c.id === selectedId);

const STATUS = {
  emergency: ["🚨 Emergency", "b-emergency"],
  human: ["Needs human", "b-human"],
  booking: ["Booking to confirm", "b-booking"],
  confirmed: ["Confirmed", "b-confirmed"],
  flagged: ["Flagged", "b-flag"],
  ai: ["Handled by Emma", "b-ai"],
};
const FILTERS = [
  ["all", "All", () => true],
  ["attention", "Needs attention", (c) => ["emergency", "human"].includes(c.status) || c.mode === "human"],
  ["booking", "Bookings", (c) => c.booking],
  ["ai", "Emma handled", (c) => c.status === "ai" || c.status === "flagged"],
];

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function renderStats() {
  const attention = conversations.filter(FILTERS[1][2]).length;
  const toConfirm = conversations.filter((c) => c.booking && c.booking.status === "Requested").length;
  const stats = [
    ["Active chats today", conversations.length, "+3 vs yesterday", ""],
    ["Needs a human", attention, attention ? "Emergencies + complaints" : "All clear", attention ? "alert" : ""],
    ["Bookings to confirm", toConfirm, "Call patients to confirm", ""],
    ["Handled fully by Emma", "82%", "of conversations this week", ""],
    ["Avg. reply time", "8s", "Emma · 24/7", ""],
  ];
  $("stats").innerHTML = stats.map(([l, v, h, cls]) => `<div class="stat ${cls}"><div class="label">${l}</div><div class="value">${v}</div><div class="hint">${h}</div></div>`).join("");
}

function renderTabs() {
  $("tabs").innerHTML = FILTERS.map(([key, label, fn]) =>
    `<button class="tab ${filter === key ? "active" : ""}" data-f="${key}">${label}<span class="n">${conversations.filter(fn).length}</span></button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach((b) => (b.onclick = () => { filter = b.dataset.f; render(); }));
}

function renderList() {
  const fn = FILTERS.find((f) => f[0] === filter)[2];
  const order = { emergency: 0, human: 1, booking: 2, flagged: 3, ai: 4, confirmed: 5 };
  const items = conversations
    .filter(fn)
    .filter((c) => !query || (c.name + " " + c.messages.map((m) => m[1]).join(" ")).toLowerCase().includes(query))
    .sort((a, b) => order[a.status] - order[b.status] || a.minsAgo - b.minsAgo);
  $("list").innerHTML = items.length ? items.map((c) => {
    const last = [...c.messages].reverse().find((m) => m[0] !== "x");
    const [label, cls] = STATUS[c.status];
    const badges = [`<span class="badge ${cls}">${label}</span>`];
    if (c.mode === "human") badges.push(`<span class="badge b-staff">Staff replying</span>`);
    if (c.lang !== "English") badges.push(`<span class="badge b-lang">${c.lang}</span>`);
    return `<div class="item ${c.id === selectedId ? "active" : ""} ${c.status === "emergency" ? "urgent" : ""}" data-id="${c.id}">
      <div class="avatar" style="background:${c.color}">${initials(c.name)}</div>
      <div class="body">
        <div class="row1"><span class="name">${esc(c.name)}</span><span class="time">${ago(c.minsAgo)}</span></div>
        <div class="preview">${last[0] === "p" ? "" : last[0] === "s" ? "You: " : "Emma: "}${esc(last[1])}</div>
        <div class="badges">${badges.join("")}</div>
      </div>
      ${c.unread ? `<div class="unread">${c.unread}</div>` : ""}
    </div>`;
  }).join("") : `<div class="empty" style="padding:16px">No conversations match.</div>`;
  $("list").querySelectorAll(".item").forEach((el) => (el.onclick = () => { selectedId = +el.dataset.id; current().unread = 0; render(); }));
}

function renderChat() {
  const c = current();
  const human = c.mode === "human";
  const banner = c.status === "emergency"
    ? `<div class="banner red">🚨<div><b>Possible emergency</b>Emma has told the patient to call 911. Consider calling them now: ${c.phone}</div></div>`
    : c.status === "human"
    ? `<div class="banner amber">✋<div><b>Emma suggests a human takes over</b>${esc(c.flags[0] || "")}</div></div>` : "";

  const msgs = c.messages.map(([who, text, ts]) => {
    if (who === "x") return `<div class="event ${text}">${esc(ts)}</div>`;
    const cls = who === "p" ? "patient" : who === "e" ? "emma" : "staff";
    const label = who === "p" ? esc(c.name) : who === "e" ? "Emma · AI" : "Rosa N. · Staff";
    return `<div class="msg ${cls}"><div class="who">${label}</div>${fmt(text)}<div class="ts">${ts}${who !== "p" ? " ✓✓" : ""}</div></div>`;
  }).join("");

  $("chatCol").innerHTML = `
    <div class="chat-head">
      <div class="avatar" style="background:${c.color}">${initials(c.name)}</div>
      <div style="flex:1;min-width:0"><div class="name">${esc(c.name)}</div><div class="meta">${c.phone} · WhatsApp · ${c.lang}</div></div>
      <span class="mode ${human ? "human" : "ai"}">${human ? "✋ You're replying" : "🤖 Emma is replying"}</span>
      ${human ? `<button class="btn primary" id="handBack">Hand back to Emma</button>` : `<button class="btn warn" id="takeOver">Take over</button>`}
    </div>
    ${banner}
    <div class="thread" id="thread"><div class="day">Today</div>${msgs}<div class="typing" id="typing"><span></span><span></span><span></span></div></div>
    ${human ? `<div class="suggest">${["I'm calling you now 📞", "Your booking is confirmed ✅", "I've passed this to our billing team."].map((s) => `<button class="chip">${s}</button>`).join("")}</div>` : ""}
    <div class="composer">
      <textarea id="input" rows="1" placeholder="${human ? "Type a message to the patient…" : "Take over to reply as staff (Emma is handling this chat)"}" ${human ? "" : "disabled"}></textarea>
      <button class="btn primary" id="send" ${human ? "" : "disabled"}>Send</button>
    </div>
    <div class="composer-note">${human ? "Emma is paused for this chat. Your messages go straight to the patient." : "Emma replies automatically. Take over any time to pause her."}</div>`;

  const thread = $("thread"); thread.scrollTop = thread.scrollHeight;
  if ($("takeOver")) $("takeOver").onclick = () => setMode("human");
  if ($("handBack")) $("handBack").onclick = () => setMode("ai");
  if (human) {
    const send = () => {
      const v = $("input").value.trim(); if (!v) return;
      c.messages.push(["s", v, nowTime()]); c.minsAgo = 0; render();
      setTimeout(() => $("input") && $("input").focus(), 0);
    };
    $("send").onclick = send;
    $("input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
    document.querySelectorAll(".chip").forEach((ch) => (ch.onclick = () => { $("input").value = ch.textContent; $("input").focus(); }));
    $("input").focus();
  }
}

function renderSide() {
  const c = current();
  const b = c.booking;
  const bookingCard = b ? `
    <div class="card"><h4>Booking request</h4>
      <div class="kv">
        <span class="k">Type</span><span>${esc(b.type)}</span>
        <span class="k">Day</span><span><b>${esc(b.day)}</b></span>
        <span class="k">Time</span><span><b>${esc(b.time)}</b></span>
        <span class="k">Reason</span><span>${esc(b.reason)}</span>
        <span class="k">Status</span><span><span class="badge ${b.status === "Confirmed" ? "b-confirmed" : "b-booking"}">${b.status}</span></span>
      </div>
      ${b.status === "Requested" ? `<div class="actions" style="margin-top:10px">
        <button class="btn primary" id="confirmBooking">✅ Mark as confirmed (after call)</button>
        <button class="btn" id="callPatient">📞 Call patient</button></div>` : ""}
    </div>` : `<div class="card"><h4>Booking</h4><div class="empty">No booking in this conversation.</div></div>`;

  $("side").innerHTML = `
    <div class="card"><h4>Patient</h4>
      <div class="kv">
        <span class="k">Name</span><span>${esc(c.name)}</span>
        <span class="k">WhatsApp</span><span>${c.phone}</span>
        <span class="k">Language</span><span>${c.lang}</span>
        <span class="k">Memory</span><span>Last 3 days</span>
      </div>
    </div>
    <div class="card"><h4>Emma's summary</h4><div class="ai-summary">${esc(c.summary)}</div></div>
    ${c.flags.length ? `<div class="card"><h4>Flags</h4><div class="flags">${c.flags.map((f) => `<div class="flag">${esc(f)}</div>`).join("")}</div></div>` : ""}
    ${bookingCard}
    <div class="card"><h4>Actions</h4><div class="actions">
      ${c.mode === "ai" ? `<button class="btn warn" id="sideTake">✋ Take over chat</button>` : `<button class="btn primary" id="sideBack">🤖 Hand back to Emma</button>`}
      ${c.status !== "ai" && c.status !== "confirmed" ? `<button class="btn" id="resolve">✔ Mark as resolved</button>` : ""}
      <button class="btn danger" id="block">⛔ Block number</button>
    </div></div>`;

  if ($("sideTake")) $("sideTake").onclick = () => setMode("human");
  if ($("sideBack")) $("sideBack").onclick = () => setMode("ai");
  if ($("resolve")) $("resolve").onclick = () => { c.status = c.booking && c.booking.status === "Confirmed" ? "confirmed" : "ai"; c.mode = "ai"; c.messages.push(["x", "green", "Marked as resolved by Rosa N."]); toast("Marked as resolved"); render(); };
  if ($("confirmBooking")) $("confirmBooking").onclick = () => { b.status = "Confirmed"; c.status = "confirmed"; c.messages.push(["x", "green", "Rosa N. called the patient · booking Confirmed (Airtable updated)"]); toast("Booking confirmed ✅"); render(); };
  if ($("callPatient")) $("callPatient").onclick = () => toast(`Calling ${c.phone}… (demo)`);
  $("block").onclick = () => toast("Number blocked (demo)");
}

function setMode(mode) {
  const c = current();
  c.mode = mode;
  c.messages.push(["x", mode === "human" ? "amber" : "", mode === "human" ? "Rosa N. took over · Emma paused" : "Handed back to Emma"]);
  if (mode === "human" && c.status === "human") c.status = "human";
  toast(mode === "human" ? "You're now replying. Emma is paused" : "Emma is back in charge 🤖");
  render();
}

function render() { renderStats(); renderTabs(); renderList(); renderChat(); renderSide(); }
$("search").oninput = (e) => { query = e.target.value.toLowerCase(); renderList(); };

// A little life for the demo: a new patient message arrives and Emma "types" a reply.
setTimeout(() => {
  const c = conversations.find((x) => x.id === 6);
  c.messages.push(["p", "Oh, one more thing. Do you do flu shots?", nowTime()]); c.minsAgo = 0; c.unread = selectedId === 6 ? 0 : 1;
  render();
  if (selectedId === 6) { const t = $("typing"); if (t) t.style.display = "block"; }
  setTimeout(() => {
    c.messages.push(["e", "We do! Flu shots are $35 and you can walk in during opening hours, no booking needed 💉", nowTime()]);
    render();
  }, 2500);
}, 9000);

render();
</script>
</body>
</html>
